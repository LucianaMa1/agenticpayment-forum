<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles — Agentic Payment</title>
  <meta name="description" content="Agentic Payment briefings published directly on agenticpayment.forum.">
  <style>
    :root { --bg:#07070e; --surface:#0d0d1a; --border:#1e1e38; --text:#eaeaf4; --muted:#9898bc; --accent:#4f7ef7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top left, rgba(79,126,247,.14), transparent 34%), var(--bg); color:var(--text); font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    nav { max-width:980px; margin:0 auto; padding:28px 22px; display:flex; justify-content:space-between; gap:16px; }
    nav a { color:var(--muted); text-decoration:none; font-size:13px; }
    main { max-width:980px; margin:0 auto; padding:44px 22px 90px; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; }
    h1 { font-size:clamp(42px,8vw,82px); line-height:.92; letter-spacing:-.06em; margin:14px 0 18px; }
    .dek { color:var(--muted); font-size:18px; max-width:720px; line-height:1.65; }
    .grid { display:grid; gap:18px; margin-top:44px; }
    .card { display:block; padding:24px; border:1px solid var(--border); border-radius:22px; background:rgba(13,13,26,.68); text-decoration:none; color:inherit; transition:transform .18s, border-color .18s; }
    .card:hover { transform:translateY(-2px); border-color:rgba(79,126,247,.65); }
    .card h2 { margin:0 0 10px; font-size:24px; letter-spacing:-.025em; }
    .card p { margin:0; color:#c8c8dc; line-height:1.65; }
    .meta { margin-top:14px; color:#666a91; font-size:13px; }
    .empty { margin-top:44px; padding:24px; border:1px dashed var(--border); border-radius:18px; color:var(--muted); }
  </style>
</head>
<body>
  <nav><a href="/">agenticpayment.forum</a><a href="/articles/">Articles</a></nav>
  <main>
    <div class="eyebrow">Agentic Payment archive</div>
    <h1>Agentic Payment Articles</h1>
    <p class="dek">The home archive for Agentic Payment briefings — published directly on agenticpayment.forum.</p>
    <section id="articles" class="grid" aria-live="polite"></section>
  </main>
  <script>
    const root = document.getElementById('articles');
    fetch('/articles/index.json?t=' + Date.now())
      .then(r => r.ok ? r.json() : [])
      .then(items => {
        if (!Array.isArray(items) || items.length === 0) {
          root.innerHTML = '<div class="empty">No articles published yet.</div>';
          return;
        }
        root.innerHTML = items.map(item => `
          <a class="card" href="${item.path || item.url}">
            <h2>${escapeHtml(item.title || 'Untitled')}</h2>
            <p>${escapeHtml(item.brief || '')}</p>
            <div class="meta">${escapeHtml((item.published_at || '').slice(0,10))} · ${escapeHtml(item.channel || 'static')}</div>
          </a>
        `).join('');
      })
      .catch(() => {
        root.innerHTML = '<div class="empty">Article index could not be loaded.</div>';
      });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    }
  </script>
</body>
</html>
